name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frozen-core:
    name: Frozen certification core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.1 scipy==1.14.1 scikit-learn==1.6.0 pandas==2.2.3 pytest
      - name: Run frozen-core test suite
        run: python -m pytest tests/test_attestra_core.py -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint webapp + attestra package
        run: ruff check webapp/server.py attestra --output-format=github
